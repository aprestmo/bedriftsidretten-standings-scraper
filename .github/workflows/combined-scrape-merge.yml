name: Scrape and Update Standings

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6-14 * * 2" # Every Tuesday, hourly 08:00–16:00 CEST (06:00–14:00 UTC)

jobs:
  scrape-standings:
    runs-on: ubuntu-latest

    steps:
      - name: 📅 Check if past stop date
        run: |
          STOP_DATE="2026-10-15"
          CURRENT_DATE=$(date -u +%Y-%m-%d)
          if [[ "$CURRENT_DATE" > "$STOP_DATE" ]]; then
            echo "Current date ($CURRENT_DATE) is after stop date ($STOP_DATE). Stopping workflow."
            exit 78
          fi
          echo "Current date ($CURRENT_DATE) is before or equal to stop date ($STOP_DATE). Continuing workflow."

      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Skip if already updated today
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if git --no-pager log --since="$TODAY" --grep="Update standings" --oneline | grep -q .; then
            echo "Standings already updated today. Skipping."
            exit 78
          fi
          echo "No update yet today. Proceeding with scrape."

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⬇️ Install Playwright Chromium only
        run: npx playwright install chromium

      - name: 📊 Scrape standings from Profixio
        run: node scrape-standings.js

      - name: 📋 Scrape results from Profixio
        run: node scrape-results.js

      - name: 📤 Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f public/standings.json public/results.json
          git diff --cached --quiet || git commit -m "Update standings and results from Profixio"
          git push
