name: Scrape and Update Standings

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  scrape-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⬇️ Install Playwright browsers
        run: npx playwright install

      - name: 📊 Scrape standings
        run: node scrape-standings.js

      - name: 🎮 Scrape played matches
        run: node scrape-played.js

      - name: 🧮 Merge scored and conceded into standings
        run: python scripts/merge_standings.py

      - name: 📤 Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/standings.json public/played-matches.json
          git diff --cached --quiet || git commit -m "Update scraped standings with goals scored and conceded"
          git push
