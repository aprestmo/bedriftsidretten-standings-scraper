name: Debug GH_PAT Token

on:
  workflow_dispatch:

jobs:
  validate-pat:
    runs-on: ubuntu-latest

    steps:
      - name: Check GH_PAT authentication
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "Checking repo access using provided token..."
          git config --global user.name "PAT Tester"
          git config --global user.email "test@github.com"
          git clone https://x-access-token:${GH_PAT}@github.com/${{ github.repository }} repo-test
          echo "✅ Success! Able to access repo with GH_PAT"