name: Daily Standings Scraper

on:
  schedule:
    - cron: '0 4 * * *' # Every day at 04:00 UTC = 06:00 CEST (Norwegian summer time)
  workflow_dispatch:    # Allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - run: npm run scrape

      - name: Commit & push updated standings
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}
          git add public/standings.json
          git commit -m "Daily update: standings.json" || echo "No changes"
          git push
